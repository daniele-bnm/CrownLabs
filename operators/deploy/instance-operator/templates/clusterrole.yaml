apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbacResourcesName }}
  labels:
    {{- include "instance-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["crownlabs.polito.it"]
  resources: ["instances", "instances/status"]
  verbs: ["get","list","watch","create","update","patch","delete","deleteCollection"]

- apiGroups: ["crownlabs.polito.it"]
  resources: ["templates", "tenants", "sharedvolumes", "sharedvolumes/status"]
  verbs: ["get","list","watch"]

- apiGroups: ["crownlabs.polito.it"]
  resources: ["clusterflavors"]
  verbs: ["get","list","watch"]

- apiGroups: [""]
  resources: ["namespaces","pods"]
  verbs: ["get","list","watch"]

- apiGroups: [""]
  resources: ["secrets","events","persistentvolumeclaims"]
  verbs: ["get","list","watch","create","patch","update"]

- apiGroups: [""]
  resources: ["services"]
  verbs: ["get","list","watch","create","patch","update", "delete"]

- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get","list","watch","create","patch","update"]

- apiGroups: ["batch"]
  resources: ["jobs", "jobs/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get","list","watch","create","patch","update","delete"]

- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "tlsroutes"]
  verbs: ["get","list","watch","create","patch","update","delete"]

# Role and RoleBinding allowing the owner of a Cluster environment to get exclusively its kubeconfig Secret.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get","list","watch","create","patch","update"]

- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get","list","watch","create","patch","update","delete"]

- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances"]
  verbs: ["get","list","watch","create","patch","update"]

- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes"]
  verbs: ["get","list","watch","create", "patch", "update", "delete"]

- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes/source"]
  verbs: ["create", "patch", "update"]

- apiGroups: ["cluster.x-k8s.io"]
  resources: ["clusters", "machinedeployments"]
  verbs: ["get","list","watch","create","patch","update"]

- apiGroups: ["controlplane.cluster.x-k8s.io"]
  resources: ["kamajicontrolplanes"]
  verbs: ["get","list","watch","create","patch","update"]

# TenantControlPlanes are read to retrieve the Service of the workload cluster API server.
- apiGroups: ["kamaji.clastix.io"]
  resources: ["tenantcontrolplanes"]
  verbs: ["get","list","watch"]

- apiGroups: ["infrastructure.cluster.x-k8s.io"]
  resources: ["kubevirtclusters", "kubevirtmachinetemplates"]
  verbs: ["get","list","watch","create","patch","update"]

- apiGroups: ["bootstrap.cluster.x-k8s.io"]
  resources: ["kubeadmconfigtemplates"]
  verbs: ["get","list","watch","create","patch","update"]

- apiGroups: ["addons.cluster.x-k8s.io"]
  resources: ["helmchartproxies"]
  verbs: ["get","list","watch","create","patch","update"]
